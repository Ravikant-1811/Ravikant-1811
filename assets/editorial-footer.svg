<svg viewBox="0 0 1000 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Contact Ravikant</title><desc id="desc">Availability and contact call to action.</desc>
  <style>:root{--ink:#111820;--muted:#65707b;--rule:#111820;--accent:#ff4d2e;--signal:#4d7c0f}@media(prefers-color-scheme:dark){:root{--ink:#f4f1e9;--muted:#9ba4af;--rule:#68717c;--accent:#ff694d;--signal:#b6ff36}}.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.blink{animation:blink 1.2s steps(1) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.blink{animation:none}}</style>
  <g class="mono"><line x1="48" y1="28" x2="952" y2="28" stroke="var(--rule)"/><circle cx="55" cy="72" r="6" fill="var(--signal)"/><text x="74" y="77" font-size="11" letter-spacing="2" fill="var(--signal)">AVAILABLE FOR SELECTED BUILDS</text><text class="serif" x="48" y="132" font-size="34" font-weight="700" fill="var(--ink)">Have a useful problem? Let's make it work.</text><text x="48" y="171" font-size="11" letter-spacing="1.8" fill="var(--muted)">PORTFOLIO  /  LINKEDIN  /  EMAIL  /  X</text><text x="952" y="171" font-size="11" letter-spacing="1.8" text-anchor="end" fill="var(--muted)">RAVIKANT UPADHYAY <tspan class="blink" fill="var(--accent)">_</tspan></text></g>
</svg>
