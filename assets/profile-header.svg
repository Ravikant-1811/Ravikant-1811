<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ravikant Upadhyay profile header</title>
  <desc id="desc">Editorial profile banner for a software developer and systems operator.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#111722" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="#F8F4E9"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect x="900" width="300" height="360" fill="#111722"/>
  <rect width="12" height="360" fill="#FB4D2E"/>

  <g font-family="Avenir Next, Century Gothic, Arial, sans-serif">
    <circle cx="62" cy="58" r="7" fill="#B9ED33"/>
    <circle cx="62" cy="58" r="13" fill="none" stroke="#B9ED33" stroke-opacity=".35" stroke-width="5"/>
    <text x="86" y="63" fill="#111722" font-size="14" font-weight="700" letter-spacing="3">AVAILABLE FOR SELECTED BUILDS</text>

    <text x="58" y="121" fill="#FB4D2E" font-size="13" font-weight="700" letter-spacing="3.4">SOFTWARE DEVELOPER + SYSTEMS OPERATOR</text>
    <text x="54" y="214" fill="#111722" font-family="Georgia, Times New Roman, serif" font-size="76" letter-spacing="-4">I build the systems</text>
    <text x="54" y="292" fill="#FB4D2E" font-family="Georgia, Times New Roman, serif" font-size="76" letter-spacing="-4">behind the work.</text>

    <text x="936" y="59" fill="#F8F4E9" fill-opacity=".56" font-size="12" font-weight="700" letter-spacing="3">RAVIKANT UPADHYAY</text>
    <line x1="936" y1="82" x2="1155" y2="82" stroke="#F8F4E9" stroke-opacity=".28"/>
    <text x="936" y="128" fill="#F8F4E9" font-family="Georgia, Times New Roman, serif" font-size="31">Engineer when</text>
    <text x="936" y="169" fill="#F8F4E9" font-family="Georgia, Times New Roman, serif" font-size="31">it needs building.</text>
    <text x="936" y="222" fill="#B9ED33" font-family="Georgia, Times New Roman, serif" font-size="31">Operator when</text>
    <text x="936" y="263" fill="#B9ED33" font-family="Georgia, Times New Roman, serif" font-size="31">it needs shipping.</text>
    <line x1="936" y1="293" x2="1155" y2="293" stroke="#F8F4E9" stroke-opacity=".28"/>
    <text x="936" y="326" fill="#F8F4E9" fill-opacity=".56" font-size="10" font-weight="700" letter-spacing="2">VADODARA - INDIA - REMOTE</text>
  </g>
</svg>
