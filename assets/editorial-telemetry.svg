<svg viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">03 - live telemetry</title><desc id="desc">Section heading for live GitHub statistics and contribution activity.</desc>
  <style>:root{--ink:#111820;--muted:#65707b;--rule:#c8c2b8;--accent:#ff4d2e;--signal:#4d7c0f}@media(prefers-color-scheme:dark){:root{--ink:#f4f1e9;--muted:#9ba4af;--rule:#414a55;--accent:#ff694d;--signal:#b6ff36}}.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}.pulse{animation:pulse 2s ease infinite}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style>
  <g class="mono"><text x="48" y="58" font-size="58" font-weight="700" fill="var(--accent)">03</text><text x="155" y="47" font-size="13" letter-spacing="4" fill="var(--ink)">LIVE TELEMETRY</text><line x1="155" y1="61" x2="952" y2="61" stroke="var(--rule)"/><circle class="pulse" cx="833" cy="43" r="5" fill="var(--signal)"/><text x="849" y="47" font-size="10" letter-spacing="2" fill="var(--signal)">SYNCED FROM GITHUB</text><text x="48" y="101" font-size="11" letter-spacing="1.5" fill="var(--muted)">CONTRIBUTION SIGNAL / REPOSITORY OUTPUT / PRODUCTIVE TIME / CONTINUOUS ACTIVITY</text></g>
</svg>
