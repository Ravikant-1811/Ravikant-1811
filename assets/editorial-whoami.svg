<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">01 - identity</title><desc id="desc">Ravikant's role, focus, operating mode, and principles.</desc>
  <style>
    :root{--ink:#111820;--muted:#65707b;--rule:#c8c2b8;--accent:#ff4d2e;--signal:#4d7c0f;--panel:#f3efe7}
    @media(prefers-color-scheme:dark){:root{--ink:#f4f1e9;--muted:#9ba4af;--rule:#414a55;--accent:#ff694d;--signal:#b6ff36;--panel:#111820}}
    .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.rise{opacity:1}.a2{animation-delay:.2s}.a3{animation-delay:.4s}.a4{animation-delay:.6s}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.rise{animation:none;opacity:1}}
  </style>
  <g class="mono">
    <text x="48" y="58" font-size="58" font-weight="700" fill="var(--accent)">01</text><text x="155" y="47" font-size="13" letter-spacing="4" fill="var(--ink)">IDENTITY</text>
    <line x1="155" y1="61" x2="952" y2="61" stroke="var(--rule)"/><text x="952" y="47" font-size="10" letter-spacing="2" text-anchor="end" fill="var(--muted)">~/01-identity</text>
    <g class="rise a2">
      <text x="48" y="118" font-size="16" fill="var(--ink)">I turn scattered workflows, manual follow-ups, and disconnected tools into software teams can run.</text>
      <text x="48" y="150" font-size="15" fill="var(--muted)">My work spans PHP apps, WordPress, automation, AI workflows, and production operations.</text>
    </g>
    <g class="rise a3">
      <rect x="48" y="184" width="437" height="105" rx="2" fill="var(--panel)" stroke="var(--rule)"/>
      <text x="68" y="211" font-size="10" letter-spacing="2" fill="var(--muted)">CURRENT ROLE</text><text x="68" y="239" font-size="14" fill="var(--ink)">Software Developer / Zeusinfinity Services</text>
      <text x="68" y="269" font-size="11" fill="var(--signal)">IMPLEMENTATION  →  DEPLOYMENT  →  RELIABILITY</text>
    </g>
    <g class="rise a4">
      <rect x="511" y="184" width="441" height="105" rx="2" fill="none" stroke="var(--rule)"/>
      <text x="531" y="211" font-size="10" letter-spacing="2" fill="var(--muted)">OPERATING PRINCIPLE</text><text class="serif" x="531" y="244" font-size="21" fill="var(--ink)">Build for the messy middle.</text>
      <text x="531" y="270" font-size="12" fill="var(--muted)">Permissions, edge cases, handoffs, maintenance, real use.</text>
    </g>
  </g>
</svg>
